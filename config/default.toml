rate_limit = 50
timeout_secs = 10
concurrency = 100
user_agent = "Temu/1.5.0"
output_dir = "./results"
rules_dir = "./rules"
dictionaries_dir = "./dictionaries"
max_recursion_depth = 2
allow_risky_rules = false
browser_crawl_enabled = true
browser_crawl_max_pages = 25
browser_crawl_max_depth = 2
browser_crawl_render_js = false
oast_wait_secs = 0
network_connection_budget = 256
network_time_budget_secs = 30

# Optional OAST/collaborator settings. OAST probes are disabled unless a scan
# supplies a callback URL and risky rules are explicitly enabled.
# oast_callback_url = "https://callback.example/{{callback_id}}"
# oast_correlation_id = "manual-correlation-id"
# oast_database_path = "./results/.cache/callbacks.sqlite"

# Optional authenticated scanning profile. Prefer --session-profile or
# TEMU_SESSION_PROFILE for secrets instead of storing tokens here.
# [session_profile]
# base_url_scope = "https://example.com"
# validate_url = "https://example.com/profile"
# bearer_token = "env:TEMU_SESSION_BEARER_TOKEN"
# refresh_command = ["pass", "show", "temu/example-token"]
# [session_profile.headers]
# X-API-Key = "env:TEMU_SESSION_API_KEY"
# [session_profile.cookies]
# session = "env:TEMU_SESSION_COOKIE_VALUE"
# [session_profile.roles.admin]
# bearer_token = "env:TEMU_ADMIN_TOKEN"
