services:
  temu:
    build: .
    image: sangkan-temu:local
    volumes:
      - ./results:/app/results:Z
      - ./rules:/app/rules:Z
      - ./dictionaries:/app/dictionaries:ro,Z
      - ./config:/app/config:ro,Z
      - ./templates:/app/templates:ro,Z
    command: ["--help"]

  redis:
    image: redis:7-alpine
    profiles: ["distributed", "benchmark", "network-lab"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  network-memcached:
    image: memcached:1.6-alpine
    profiles: ["network-lab"]
    ports:
      - "127.0.0.1:11211:11211"

  network-mongodb:
    image: mongo:8
    profiles: ["network-lab"]
    ports:
      - "127.0.0.1:27017:27017"

  network-postgres:
    image: postgres:17-alpine
    profiles: ["network-lab"]
    environment:
      POSTGRES_PASSWORD: temu-network-lab
    command: ["postgres", "-c", "ssl=off"]
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  network-mqtt:
    image: eclipse-mosquitto:2
    profiles: ["network-lab"]
    command:
      - /bin/sh
      - -c
      - |
        printf 'listener 1883 0.0.0.0\nallow_anonymous true\n' > /tmp/mosquitto.conf
        exec mosquitto -c /tmp/mosquitto.conf
    ports:
      - "127.0.0.1:1883:1883"

  network-rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ["network-lab"]
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  temu-worker:
    image: sangkan-temu:local
    profiles: ["distributed"]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./results:/app/results:Z
      - ./rules:/app/rules:ro,Z
      - ./dictionaries:/app/dictionaries:ro,Z
      - ./config:/app/config:ro,Z
      - ./templates:/app/templates:ro,Z
    command: ["worker", "--redis", "redis://redis:6379", "--ports", "80,443,8080"]

  temu-coordinator:
    image: sangkan-temu:local
    profiles: ["distributed"]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./results:/app/results:Z
      - ./benchmark:/app/benchmark:ro,Z
      - ./rules:/app/rules:ro,Z
      - ./dictionaries:/app/dictionaries:ro,Z
      - ./config:/app/config:ro,Z
      - ./templates:/app/templates:ro,Z
    command:
      ["coordinator", "--redis", "redis://redis:6379", "--list", "/app/benchmark/targets.compose.txt"]

  juice-shop:
    image: bkimminich/juice-shop:latest
    profiles: ["benchmark"]
    ports:
      - "127.0.0.1:3000:3000"

  webgoat:
    image: webgoat/webgoat:latest
    profiles: ["benchmark"]
    ports:
      - "127.0.0.1:8081:8080"

  dvwa:
    image: vulnerables/web-dvwa:latest
    profiles: ["benchmark"]
    ports:
      - "127.0.0.1:8082:80"

  benchmark-nginx:
    image: nginx:alpine
    profiles: ["benchmark"]
    ports:
      - "127.0.0.1:8083:80"

  benchmark-httpbin:
    image: kennethreitz/httpbin:latest
    profiles: ["benchmark"]
    ports:
      - "127.0.0.1:8084:80"
