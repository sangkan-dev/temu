schema_version: "1"
rule_type: network
id: "NETWORK-TLS-HOSTNAME-MISMATCH"
name: "TLS certificate does not match the scanned hostname"
metadata:
  author: "sangkan-dev"
  license: "MIT"
  last_verified: "2026-06-14"
compatibility:
  minimum_temu_version: "1.5.0"
  required_capabilities: ["network_service", "tls_fingerprint"]
severity: medium
cvss: 5.3
risk_level: safe
requires_confirmation: false
matcher:
  required_signals: ["tls_hostname_mismatch"]
remediation: "Deploy a certificate whose Subject Alternative Names include the intended service hostname."
references:
  - "https://datatracker.ietf.org/doc/html/rfc6125"
