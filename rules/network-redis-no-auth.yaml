schema_version: "1"
rule_type: network
id: "NETWORK-REDIS-NO-AUTH"
name: "Redis accepts commands without authentication"
metadata:
  author: "sangkan-dev"
  license: "MIT"
  last_verified: "2026-05-25"
compatibility:
  minimum_temu_version: "1.4.0"
  required_capabilities: ["network_service"]
protocols: ["redis"]
products: ["Redis"]
severity: high
cvss: 8.6
risk_level: safe
requires_confirmation: false
matcher:
  protocol_response_regex: "(?i)^\\+PONG"
  auth_required: false
remediation: "Require Redis authentication or ACLs and restrict the listener to trusted network segments."
references:
  - "https://redis.io/docs/latest/operate/oss_and_stack/management/security/"
