schema_version: "1"
rule_type: network
id: "NETWORK-MONGODB-NO-AUTH"
name: "MongoDB permits unauthenticated database listing"
metadata:
  author: "sangkan-dev"
  license: "MIT"
  last_verified: "2026-06-14"
compatibility:
  minimum_temu_version: "1.5.0"
  required_capabilities: ["network_service"]
protocols: ["mongodb"]
products: ["MongoDB"]
severity: critical
cvss: 9.1
risk_level: safe
requires_confirmation: false
matcher:
  auth_required: false
  required_signals: ["unauthenticated_database_listing"]
remediation: "Enable MongoDB access control and restrict the listener to trusted network segments."
references:
  - "https://www.mongodb.com/docs/manual/administration/security-checklist/"
