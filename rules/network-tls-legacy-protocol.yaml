schema_version: "1"
rule_type: network
id: "NETWORK-TLS-LEGACY-PROTOCOL"
name: "Service accepts a legacy TLS protocol"
metadata:
  author: "sangkan-dev"
  license: "MIT"
  last_verified: "2026-06-14"
compatibility:
  minimum_temu_version: "1.5.0"
  required_capabilities: ["network_service", "tls_fingerprint"]
severity: high
cvss: 7.4
risk_level: safe
requires_confirmation: false
matcher:
  required_signals: ["legacy_tls_accepted"]
remediation: "Disable TLS 1.0 and TLS 1.1; require TLS 1.2 or TLS 1.3."
references:
  - "https://datatracker.ietf.org/doc/rfc8996/"
