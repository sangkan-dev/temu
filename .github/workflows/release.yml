name: Release Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux-static:
    name: Linux x86_64 static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build static binary
        run: |
          RUSTFLAGS='-C target-feature=+crt-static' cargo build --release --target x86_64-unknown-linux-gnu -p cli

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: temu-linux-x86_64-static
          path: target/x86_64-unknown-linux-gnu/release/temu

  macos-arm64:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build binary
        run: cargo build --release --target aarch64-apple-darwin -p cli

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: temu-macos-arm64
          path: target/aarch64-apple-darwin/release/temu

  github-release:
    name: GitHub Release
    needs:
      - linux-static
      - macos-arm64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp dist/temu-linux-x86_64-static/temu release/temu-linux-x86_64-static
          cp dist/temu-macos-arm64/temu release/temu-macos-arm64
          chmod +x release/temu-*
          sha256sum release/* > release/SHA256SUMS

      - name: Prepare release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          awk -v version="${VERSION}" '
            $0 ~ "^## \\[" version "\\]" { print; in_section = 1; next }
            in_section && $0 ~ "^## \\[" { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release/* --clobber
          else
            gh release create "${TAG_NAME}" release/* \
              --title "Temu ${TAG_NAME}" \
              --notes-file release-notes.md
          fi
