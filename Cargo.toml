[workspace]
members = [
    "crates/core",
    "crates/discovery",
    "crates/fingerprint",
    "crates/fuzzing",
    "crates/vulnerability",
    "crates/cve_client",
    "crates/verifier",
    "crates/reporter",
    "crates/cli",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
